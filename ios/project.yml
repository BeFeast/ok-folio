name: OKFolio
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

packages:
  FolioKit:
    path: Core

targets:
  OKFolio:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - App/Sources
    dependencies:
      - package: FolioKit
        product: FolioKit
    settings:
      base:
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.befeast.okfolio
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
        # Resolved from the FOLIO_TEAM_ID build setting passed on the
        # xcodebuild command line by scripts/m4-build-install.sh.
        DEVELOPMENT_TEAM: $(FOLIO_TEAM_ID)

schemes:
  OKFolio:
    build:
      targets:
        OKFolio: all
    run:
      config: Debug
    archive:
      config: Release
